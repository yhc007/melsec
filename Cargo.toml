[package]
name = "melsec-plc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "melsec-plc-tui"
path = "src/main_tui.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
thiserror = "1.0"
egui = "0.24"
eframe = "0.24"
serde = { version = "1.0", features = ["derive"] }
ratatui = "0.23"
crossterm = "0.27"
rdkafka = { version = "0.36", features = ["tokio"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

