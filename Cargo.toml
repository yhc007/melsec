[package]
name = "melsec"
version = "0.2.0"
edition = "2021"
description = "MELSEC PLC connector with AAS integration"

[lib]
name = "melsec"
path = "src/lib.rs"

[[bin]]
name = "melsec-plc"
path = "src/main.rs"

[[bin]]
name = "melsec-plc-tui"
path = "src/main_tui.rs"

[[bin]]
name = "melsec-aas"
path = "src/main_aas.rs"

[[bin]]
name = "melsec-plc-daemon"
path = "src/main_daemon.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
thiserror = "1.0"
egui = "0.24"
eframe = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.23"
crossterm = "0.27"
rdkafka = { version = "0.36", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"
env_logger = "0.10"
log = "0.4"

# AAS Bridge 추가 의존성
toml = "0.8"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
